name: chess_multiplayer
description: A P2P real-time multiplayer chess game.
publish_to: 'none'
version: 1.7.2+10

environment:
  sdk: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependencies:
  flutter:
    sdk: flutter
  chess: ^0.7.0
  flutter_chess_board: ^1.0.1
  chess_vectors_flutter: ^1.1.0
  web_socket_channel: ^3.0.1
  provider: ^6.1.1
  audioplayers: ^6.8.1
  wakelock_plus: ^1.8.2
  shared_preferences: ^2.3.3

dependency_overrides:
  chess_vectors_flutter:
    path: third_party/chess_vectors_flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
